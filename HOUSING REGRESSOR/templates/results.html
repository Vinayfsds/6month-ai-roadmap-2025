<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Prediction Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            margin: 2rem auto;
            max-width: 700px;
        }
        .header-section {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 2rem;
            border-radius: 20px 20px 0 0;
            text-align: center;
        }
        .result-section {
            padding: 2rem;
        }
        .result-card {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        .result-card .card-body {
            padding: 2rem;
            text-align: center;
        }
        .model-name {
            color: #2c3e50;
            font-weight: 700;
            font-size: 1.3rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .price-display {
            font-size: 2.5rem;
            font-weight: 800;
            color: #27ae60;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin: 1rem 0;
        }
        .price-label {
            color: #7f8c8d;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .btn-custom {
            padding: 0.75rem 2rem;
            border-radius: 25px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border: none;
            margin: 0.5rem;
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            color: white;
        }
        .btn-secondary-custom {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            color: #2c3e50;
        }
        .btn-secondary-custom:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            color: #2c3e50;
        }
        .success-icon {
            font-size: 3rem;
            color: #27ae60;
            margin-bottom: 1rem;
        }
        @media (max-width: 768px) {
            .main-container {
                margin: 1rem;
            }
            .price-display {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="main-container">
            <div class="header-section">
                <h1 class="mb-3">
                    <i class="fas fa-chart-line me-3"></i>
                    Prediction Results
                </h1>
                <p class="mb-0 fs-5">Your house price prediction is ready!</p>
            </div>
            
            <div class="result-section">
                <div class="text-center mb-4">
                    <i class="fas fa-check-circle success-icon"></i>
                </div>
                
                <div class="card result-card">
                    <div class="card-body">
                        <div class="model-name">
                            <i class="fas fa-brain"></i>
                            Model Used: {{ model_name }}
                        </div>
                        
                        <div class="price-label">Predicted House Price</div>
                        <div class="price-display">
                            <i class="fas fa-dollar-sign"></i>{{ prediction }}
                        </div>
                        
                        <div class="mt-4">
                            <small class="text-muted">
                                <i class="fas fa-info-circle me-1"></i>
                                This prediction is based on the input features and selected ML model
                            </small>
                        </div>
                    </div>
                </div>
                
                <div class="text-center">
                    <a href="/" class="btn btn-custom btn-primary-custom">
                        <i class="fas fa-redo me-2"></i>
                        Make Another Prediction
                    </a>
                    <a href="/results" class="btn btn-custom btn-secondary-custom">
                        <i class="fas fa-chart-bar me-2"></i>
                        View Model Performance
                    </a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

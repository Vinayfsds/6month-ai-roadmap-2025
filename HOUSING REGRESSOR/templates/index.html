<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏠 Housing Price Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .main-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            margin: 2rem auto;
            max-width: 800px;
        }

        .header-section {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 2rem;
            border-radius: 20px 20px 0 0;
            text-align: center;
        }

        .form-section {
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .form-control:focus {
            border-color: #4facfe;
            box-shadow: 0 0 0 0.2rem rgba(79, 172, 254, 0.25);
        }

        .btn-predict {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .btn-secondary-custom {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            border: none;
            color: #2c3e50;
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-secondary-custom:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            color: #2c3e50;
        }

        .btn-customer-custom {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            border: none;
            color: #2c3e50;
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-customer-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(168, 237, 234, 0.4);
            color: #2c3e50;
            text-decoration: none;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 768px) {
            .input-group {
                grid-template-columns: 1fr;
            }

            .main-container {
                margin: 1rem;
            }
        }

        .feature-icon {
            color: #4facfe;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="main-container">
            <div class="header-section">
                <h1 class="mb-3">
                    <i class="fas fa-home me-3"></i>
                    Housing Price Predictor
                </h1>
                <p class="mb-0 fs-5">Get accurate house price predictions using advanced ML models</p>
            </div>

            <div class="form-section">
                <form action="/predict" method="POST">
                    <div class="input-group">
                        <div class="form-group">
                            <label for="income" class="form-label">
                                <i class="fas fa-dollar-sign feature-icon"></i>
                                Average Area Income
                            </label>
                            <input type="number" step="any" class="form-control" id="income" name="Avg. Area Income"
                                placeholder="e.g., 65000" required>
                        </div>

                        <div class="form-group">
                            <label for="age" class="form-label">
                                <i class="fas fa-calendar-alt feature-icon"></i>
                                Average House Age (years)
                            </label>
                            <input type="number" step="any" class="form-control" id="age" name="Avg. Area House Age"
                                placeholder="e.g., 15" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <div class="form-group">
                            <label for="rooms" class="form-label">
                                <i class="fas fa-door-open feature-icon"></i>
                                Average Number of Rooms
                            </label>
                            <input type="number" step="any" class="form-control" id="rooms"
                                name="Avg. Area Number of Rooms" placeholder="e.g., 7" required>
                        </div>

                        <div class="form-group">
                            <label for="bedrooms" class="form-label">
                                <i class="fas fa-bed feature-icon"></i>
                                Average Number of Bedrooms
                            </label>
                            <input type="number" step="any" class="form-control" id="bedrooms"
                                name="Avg. Area Number of Bedrooms" placeholder="e.g., 3" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="population" class="form-label">
                            <i class="fas fa-users feature-icon"></i>
                            Area Population
                        </label>
                        <input type="number" step="any" class="form-control" id="population" name="Area Population"
                            placeholder="e.g., 35000" required>
                    </div>

                    <div class="form-group">
                        <label for="model" class="form-label">
                            <i class="fas fa-brain feature-icon"></i>
                            Select ML Model
                        </label>
                        <select class="form-control" id="model" name="model">
                            {% for model_name in model_names %}
                            <option value="{{ model_name }}">{{ model_name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-primary btn-predict w-100 mb-3">
                            <i class="fas fa-magic me-2"></i>
                            Predict House Price
                        </button>
                    </div>
                </form>

                <div class="text-center">
                    <a href="/results" class="btn btn-secondary-custom">
                        <i class="fas fa-chart-bar me-2"></i>
                        View Model Performance
                    </a>
                </div>
                <div class="text-center">
                    <a href="/customer" class="btn btn-customer-custom">
                        <i class="fas fa-users me-2"></i>
                        Interested Home Buyers
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
